<!DOCTYPE html>
<html lang="zh-cmn-Hans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>预览</title>
        <link href="img/favicon.ico" rel="icon" type="image/png" />
        <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="plugins/font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="vditor/dist/index.css" rel="stylesheet" type="text/css" />
        <link href="css/viewer.min.css" rel="stylesheet" type="text/css" />
        <style>
            html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
            #topbar {
                position: fixed; top: 0; left: 0; right: 0; height: 48px;
                display: flex; align-items: center; gap: 8px; padding: 0 12px;
                background: #fff; border-bottom: 1px solid #e5e5e5; z-index: 1000; box-sizing: border-box;
            }
            #fileTitle {
                flex: 1; font-weight: bold;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            }
            #content { padding-top: 48px; }
            #loading { padding: 60px; text-align: center; color: #999; }
            #viewer-error { padding: 60px; text-align: center; color: #c00; }
            #unsupported { padding: 60px; text-align: center; color: #888; }
            #vditor, #editor, #output { display: none; overflow: scroll; }
            #container { display: none; justify-content: center; align-items: flex-start; text-align: center; }
            #container .xgplayer { margin: 0 auto !important; }
        </style>
        <script type="text/javascript" src="js/webdav.js"></script>
        <script type="text/javascript" src="js/jquery.min.js"></script>
        <script type="text/javascript" src="js/bootstrap.min.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
        <script src="js/ace.min.js"></script>
        <script src="js/theme-xcode.js"></script>
        <script src="vditor/dist/index.min.js"></script>
        <script src="js/xgplayer/browser/index.js" type="text/javascript"></script>
        <script src="js/viewer.min.js" type="text/javascript"></script>
    </head>
    <body>
        <div id="topbar">
            <a class="btn btn-default" href="index.html"><i class="fa fa-arrow-left"></i> 返回</a>
            <span id="fileTitle"></span>
            <button id="saveBtn" class="btn btn-primary" style="display:none;">保存 (Ctrl+S)</button>
            <a id="downloadBtn" class="btn btn-default" download>下载</a>
        </div>

        <div id="content">
            <div id="loading">加载中...</div>
            <div id="viewer-error" style="display:none;"></div>
            <div id="container"><div id="player"></div></div>
            <div id="vditor"></div>
            <div id="editor"></div>
            <div id="output"></div>
            <div id="unsupported" style="display:none;">该文件类型暂不支持在线预览, 可点击右上角"下载"获取文件。</div>
        </div>

        <script type="application/javascript">
            var fs = client();
            var href = new URLSearchParams(window.location.search).get('href');
            var imgDir;
            var dirty = false;

            function markDirty() { dirty = true; }

            window.addEventListener('beforeunload', function (e) {
                if (dirty) {
                    e.preventDefault();
                    e.returnValue = '有未保存的修改, 确定离开?';
                    return e.returnValue;
                }
            });

            // Ctrl+S / Cmd+S 保存
            $(document).on('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault();
                    $('#saveBtn:visible').click();
                }
            });

            function hideLoading() { $('#loading').hide(); }
            function showError(msg) { $('#loading').hide(); $('#viewer-error').text(msg).show(); }

            if (!href) {
                showError('缺少 href 参数, 请从文件管理页面打开。');
            } else {
                imgDir = client().dir(href.substring(0, href.lastIndexOf('/')) + '/imgs');
                var file = fs.file(href);
                var name = file.name;
                $('#fileTitle').text(name);
                $('#downloadBtn').attr('download', name).attr('href', href);

                // 只读模式下隐藏保存按钮
                if (window.READONLY) $('#saveBtn').remove();

                var doctype = file.doctype;
                if (doctype === 'image') {
                    var img = $('<img alt="预览">').attr('src', href).css({
                        'max-width': '100%',
                        'max-height': ($(window).height() - 48) + 'px',
                        'display': 'block',
                        'margin': '0 auto'
                    });
                    img.on('load', function () {
                        hideLoading();
                        // Viewer.js 存在时支持点击缩放/旋转, 否则普通展示
                        if (window.Viewer) new Viewer(img[0], { navbar: false, title: [1, true], keyboard: true });
                    });
                    img.on('error', function () { showError('图片加载失败'); });
                    $('#content').append(img);
                } else if (doctype === 'video') {
                    $('#container').css('display', 'flex');
                    hideLoading();
                    new Player({
                        id: 'player',
                        url: href,
                        height: $(window).height() - 48,
                        fitVideoSize: 'fixHeight',
                        download: false,
                        pip: true,
                        playbackRate: [0.5, 0.75, 1, 1.5, 2]    //传入倍速可选数组
                    });
                } else if (doctype === 'audio') {
                    $('#container').css('display', 'flex');
                    hideLoading();
                    $('#container').css('padding-top', '60px').append(
                        $('<audio controls>').css({ 'width': '90%', 'max-width': '720px' }).attr('src', href)
                    );
                } else if (doctype === 'pdf') {
                    var pdfiframe = $('<iframe width="100%" style="display:block;border:none;">').attr('src', href);
                    pdfiframe.height($(window).height() - 48);
                    pdfiframe.on('load', hideLoading);
                    $('#content').append(pdfiframe);
                } else if (doctype === 'text') {
                    loadText(file, name, href);
                } else {
                    hideLoading();
                    $('#unsupported').show();
                }
            }

            // ---- 文本 / Markdown 编辑 (含 _davshell 运行模式) ----
            function loadText(file, name, href) {
                var shellmode = false, outfile;
                if (name === '_davshell.sh' || name === '_davshell.cmd') {
                    shellmode = true;
                    outfile = client().file(href.substring(0, href.length - name.length) + '_davshell.out');
                    $('#saveBtn').text('运行 (Alt-Enter)');
                    $('#downloadBtn').hide();
                }
                file.read(function (res, status) {
                    if (status !== '200') {
                        showError('文件读取失败 (HTTP ' + status + ')');
                        return;
                    }
                    hideLoading();
                    var editor;
                    if (name.endsWith('.md')) {
                        $('#vditor').show();
                        var uploadFun = _UPLOAD;
                        uploadFun.onloadSuccess = function (){
                            uploadFun.fileindex ++;
                            if(uploadFun.fileindex <= uploadFun.fileobjarr.length - 1){
                                uploadFun.uploadStart();
                            }else{
                                uploadFun.process = false;
                                var insertVal = '';
                                for(var i in uploadFun.fileobjarr){
                                    insertVal += '![](' + imgDir.url + '/' + encodeURIComponent(uploadFun.fileobjarr[i].name) + ')\n '
                                }
                                editor.insertValue(insertVal);
                            }
                        };
                        uploadFun.uploadStart = function (overwrite){
                            var fileobj = uploadFun.fileobjarr[uploadFun.fileindex];
                            if(!overwrite){
                                WebDAV.PROPFIND(imgDir.url + '/' + encodeURIComponent(fileobj.name), function (resbody, st) {
                                    if(st !== '404'){
                                        if(confirm('\'' + fileobj.name + '\' 已存在, 确定覆盖? [取消=跳过]')){
                                            uploadFun.uploadStart(true);
                                        }else{
                                            uploadFun.onloadSuccess(); // 跳过该文件
                                        }
                                    }else{
                                        uploadFun.uploadStart(true);
                                    }
                                });
                            }else{
                                uploadFun.process = true;
                                imgDir.upload(fileobj.name, fileobj, uploadFun.onloadSuccess, uploadFun.onload, uploadFun.onerror, null, null);
                            }
                        };
                        editor = new Vditor('vditor', {
                            mode: 'wysiwyg',
                            height: document.documentElement.clientHeight - 100,
                            value: res,
                            cache: {
                                enable: false
                            },
                            after: function(){
                                $('#vditor').on('input', markDirty);
                            }
                        });
                    }else{
                        editor = ace.edit('editor');
                        var output;
                        editor.setFontSize(16);
                        editor.setTheme('ace/theme/xcode');
                        try {
                            var mode = aceModeFor(name);
                            if (mode) editor.getSession().setMode('ace/mode/' + mode);
                        } catch (e) { /* 无对应 mode 文件时保持纯文本 */ }
                        editor.setValue(res, 1);
                        editor.focus();
                        editor.on('change', markDirty);

                        $('#editor').css('height', shellmode ? (($(window).height() - 48) / 2) : ($(window).height() - 48));
                        $('#editor').show();

                        if(shellmode){
                            output = ace.edit('output');
                            output.setTheme("ace/theme/xcode");
                            output.setReadOnly(true);
                            editor.setFontSize(14);
                            $('#output').css('height', ($(window).height() - 48) / 2);
                            $('#output').show();

                            editor.commands.addCommand({
                                name: 'runshell',
                                bindKey: { win: 'Alt-Enter', mac: 'Enter' },
                                exec: function (editor) {
                                    $('#saveBtn').trigger('click');
                                },
                                readOnly: false
                            });

                            var refresh = true;
                            $(document).on('click', function () {
                                refresh = true;
                            });

                            var counter = 0;
                            var outres;
                            setInterval(function () {
                                if (document.hidden) return; // 页面不可见时暂停轮询
                                counter ++;
                                if(counter > 10000) counter = 0;
                                if(refresh === true || counter % 50 === 0){ // 主动点击刷新 或 每 20s 刷新一次
                                    if(refresh === true) refresh = false;
                                    outfile.read(function (res, status) {
                                        if(status == 200 && outres !== res){
                                            outres = res;
                                            output.setValue(res, 1);
                                            output.renderer.scrollToRow(res.split('\n').length + 1);
                                        }
                                    });
                                }
                            }, 400);
                        }
                    }
                    $('#saveBtn').show();
                    $('#saveBtn').click(function () {
                        file.write(editor.getValue().replace(/\r/g, ''), function (res2, status2) {
                            if (status2 !== '201' && status2 !== '204' && status2 !== '200') {
                                alert('保存失败 (HTTP ' + status2 + ')');
                                return;
                            }
                            file.read(function (r2, s2) {
                                if (s2 === '200') {
                                    editor.setValue(r2.trim(), 1);
                                    editor.focus();
                                }
                                dirty = false;
                            });
                        });
                    });
                });
            }

            // 按扩展名映射 ACE 语法高亮 mode (mode 文件不存在时 ace 自动回退纯文本)
            function aceModeFor(name) {
                if (typeof ace === 'undefined') return null;
                var ext = (name.split('.').pop() || '').toLowerCase();
                var map = {
                    js: 'javascript', json: 'json', html: 'html', htm: 'html', css: 'css',
                    xml: 'xml', sql: 'sql', sh: 'sh', bash: 'sh', bat: 'sh', cmd: 'sh', ps1: 'sh',
                    py: 'python', java: 'java', c: 'c_cpp', h: 'c_cpp', cpp: 'c_cpp', hpp: 'c_cpp',
                    go: 'golang', md: 'markdown', yml: 'yaml', yaml: 'yaml', php: 'php', rb: 'ruby'
                };
                return map[ext] || null;
            }
        </script>

    </body>
</html>
