<!DOCTYPE html>
<html lang="zh-cmn-Hans">


<head>

    <style>
        .faicon {
            zoom: 1.3;
        }
        .btn-remark {
            font-size: 10px;
        }
        .input-hide {
            display: none!important;
        }
        .input-show {
            display: inline-block!important;
        }
        #footer .btn {
            padding: 12px 12px!important;
        }
        #footer {
            height: 4.5em;
            padding: 0;
        }
        .file-control {
            width: 30px!important;
        }
        /* 列表行/图标/缩略图/元信息外观统一在 css/custom.css 维护 */
        #file-wrapper {
            position: relative;
            width: 240px;
            flex-shrink: 0;

            position: absolute;

            color: var(--text-sub);
        }

            padding-left: 30px;

    <script src="js/long-press-event.min.js"></script>
    <script src="plugins/pace/pace.min.js"></script>

    <script>
        var customToolbar = 'show-when-custom';
        var curToolbar = customToolbar;
        function changeToolbar(toolbar){
            if(!toolbar) toolbar = customToolbar;
            curToolbar = toolbar;
            var arr = ['show-when-custom', 'show-when-select', 'show-when-new', 'show-when-sort', 'show-when-mvcp'];
            for(var i in arr){
                if(arr[i] == toolbar){
                    // 用 '' 交回样式表控制, 桌面组是 inline-flex, 移动端组是 BS3 table
                    $('.' + arr[i]).css('display', '');
                }else{
                    $('.' + arr[i]).css('display', 'none');
                }
            }
        }

        var curPath = getStorage('curPath') || '';
        var curDir;
        var fs = client();

        $(document).ready(function (){
            // i18n
            $('.btn-remark').addClass('i18n-key');
            changeLang();
            updateLangBtn();

            // toolbar
            changeToolbar();

            // 只读模式: 隐藏所有写操作按钮
            if(window.READONLY){
                var writeFns = ['mkdir', 'newfile', 'uploadFiles', 'copyfiles', 'cutfiles', 'rename', 'deleteFiles', 'paste'];
                $('#navbar .btn, #footer .btn').each(function(){
                    var oc = $(this).attr('onclick') || '';
                    for(var i in writeFns){
                        if(oc.indexOf(writeFns[i]) !== -1){ $(this).hide(); break; }
                    }
                });
            }

            // 隐藏文件按钮初始状态
            updateHiddenBtn();

            // 视图模式恢复(列表/网格)
            applyView();

            // 目录内过滤
            $('#file-filter').on('input', applyFilter);

            // 拖拽上传(支持文件夹, 平铺上传到当前目录)
            $(document).on('dragover', function (e) { e.preventDefault(); });
            $(document).on('drop', function (e) {
                e.preventDefault();
                var dt = e.originalEvent.dataTransfer;
                if(!dt || window.READONLY) return;
                if(_UPLOAD.process) return;
                collectFilesFromDrop(dt, function (fileArr) {
                    if(fileArr.length) uploadFiles(fileArr);
                });
            });

            // 键盘快捷键: Ctrl+A 全选 / Delete 删除 / F2 重命名 / Esc 取消
            $(document).on('keydown', function (e) {
                var tag = (e.target.tagName || '').toLowerCase();
                if(tag === 'input' || tag === 'textarea' || $(e.target).is('[contenteditable]')) return;
                if(e.ctrlKey || e.metaKey){
                    if(e.key.toLowerCase() === 'a'){
                        e.preventDefault();
                        changeToolbar('show-when-select');
                        $('.checkbox').removeClass('hide').prop('checked', true);
                    }
                    return;
                }
                switch(e.key){
                    case 'Delete':
                        if($('#file-list .checkbox:checked').length) deleteFiles();
                        break;
                    case 'F2':
                        e.preventDefault();
                        rename();
                        break;
                    case 'Escape':
                        cancel();
                        break;
                }
            });

            // sort
            $('.fa-sort-amount').addClass('hide');
            var sortItem = getStorage('sortItem');
            var asc = getStorage(sortItem + 'asc') === 'true' ? 'asc' : 'desc';
            $('.for-sort-' + sortItem).find('.fa-sort-amount-' + asc).removeClass('hide');
            $('.for-sort').click(function () {
                var sortItem = $(this).attr('sortitem');
                setStorage('sortItem', sortItem);
                var ascname = sortItem + 'asc';
                var asc = getStorage(sortItem + 'asc') === 'true' ? 'false' : 'true';
                setStorage(ascname, asc);

                $('.fa-sort-amount').addClass('hide');
                $('.for-sort-' + sortItem).find('.fa-sort-amount-' + (asc == 'true' ? 'asc' : 'desc')).removeClass('hide');

                loadDir(fs.dir(curPath));
            });

            loadDir(fs.dir(curPath));
        });


    </script>

</head>

    <script>
        var uplihtml = $('#up-li')[0].outerHTML;
        var folderlihtml = $('#folder-li')[0].outerHTML;
        var filelihtml = $('#file-li')[0].outerHTML;

        var loadDir = function (dir) {
            curPath = dir.url;
            curDir = dir;
            setStorage('curPath', curPath.replace(root, ''));
            dir.children(function (children) {
                if(getStorage('hideDot') === 'true'){
                    children = children.filter(function (c) { return c.name.charAt(0) !== '.'; });
                }
                children.sort(sortFor);
                $('#file-list').empty();
                $('#file-list').append($('#up-li').clone(true));
                for (var i in children) {
                    var row = getRow(children[i]);
                    $('#file-list').append(row);
                }
                // 空目录时显示空态块
                $('#empty-dir').toggleClass('hide', children.length !== 0);
                applyFilter();
            });

            $('.breadcrumb').empty();
            var splpath = decodeUriSafe(curPath.replace(root, '')).split('/');
            var lipath = '';
            for(var i in splpath){
                lipath += '/' + splpath[i];
                if(lipath == '/') lipath = '';
                var li = $('<li>').attr('path', encodeURIComponent(lipath)).append($('<a>').text(splpath[i] || '/'));
                li.on('click', function (){
                    loadDir(fs.dir(root + decodeUriSafe($(this).attr('path'))));
                });
                $('.breadcrumb').append(li);
            }
        };

        var getRow = function (obj) {
            var namestr = obj.name;
            if (namestr.length > 45) namestr = namestr.substring(0, 43) + '...';
            namestr = escapeHtml(namestr);
            var row;
            if(obj.type == 'dir'){
                row = $(
                    folderlihtml.replace('$namestr', namestr)
                        .replace('$name', escapeHtml(obj.name))
                        .replace('$size', obj.size || '--')
                        .replace('$lastmodified', relTime(obj.lastmodified))
                        .replace('"folder-li"', '""')
                );
            }
            else if(obj.type == 'file'){
                var iconHtml = iconFor(obj.name, obj.doctype);
                if(obj.doctype === 'image'){
                    iconHtml = '<img class="file-thumb" loading="lazy" alt="" src="' + escapeHtml(obj.url) + '">';
                }
                row = $(
                    filelihtml.replace('<i class="demo-psi-file text-success"></i>', iconHtml)
                        .replace('$namestr', namestr)
                        .replace('$name', escapeHtml(obj.name))
                        .replace('$size', obj.size || '--')
                        .replace('$lastmodified', relTime(obj.lastmodified))
                        .replace('"file-li"', '""')
                );
            }
            row.attr('data-name', obj.name);
            row[0].fsdata = obj;
            row.on('click', function (event) {
                if(curToolbar == 'show-when-select'){
                    $(this).find('.checkbox').click();
                    return;
                }
                var _this = $(this);
                var fsdata = _this[0].fsdata;
                if (event.target.tagName.toUpperCase() !== 'INPUT') {
                    if (fsdata.type === 'file') {
                        url = fsdata.url;
                        if(!!fsdata.doctype){
                            url = 'viewer.html?href=' + encodeURIComponent(url) + (window.READONLY ? '&readonly=1' : '');
                        }
                        window.open(url);
                    } else if (fsdata.type === 'dir') {
                        loadDir(fs.dir(fsdata.url));
                    }
                }
            });
            row.on('long-press', function (){
                changeToolbar('show-when-select');
                $('.checkbox').removeClass('hide');
                // $(this).find('.checkbox').prop('checked', true);
            });
            return row;
        }

        var uploadFiles = function (fileArr) {
            if(window.READONLY){ alert(t('Readonly upload')); return; }
            if (_UPLOAD.process) return;
            _UPLOAD.fileobjarr = fileArr;
            _UPLOAD.fileindex = 0;
            _UPLOAD.uploadStart();
            changeToolbar();
        };

        var deleteFiles = function () {
            var fileArr = getCheckedFiles();
            if (fileArr.length === 0) return;
            var names = fileArr.slice(0, 20).map(function (f) { return f.name; }).join('\n');
            var more = fileArr.length > 20 ? (t('More suffix').replace('{n}', fileArr.length)) : '';
            if (confirm(t('Delete confirm') + names + more)) {
                _DELETE.fileobjarr = fileArr;
                _DELETE.fileindex = 0;
                _DELETE.deleteStart();
                changeToolbar();
                $('.checkbox').prop('checked', false);
                $('.checkbox').addClass('hide');
            }
        };

        var mkdir = function () {
            var dirname = prompt(t('Input folder name'), t('Default folder name'));
            if (dirname) {
                curDir.mkdir(dirname, function (res, status) {
                    if (status == 201) {
                        loadDir(fs.dir(curPath));
                        return;
                    }
                    alert(t('Invalid folder name'));
                    mkdir();
                });
                changeToolbar();
            }
        };

        var newfile = function () {
            var filename = prompt(t('Input file name'), t('Default file name'));
            if (filename) {
                curDir.upload(filename, '', function (res, status) {
                    if (status == 201) {
                        loadDir(fs.dir(curPath));
                        return;
                    }
                    alert(t('Invalid file name'));
                    newfile();
                });
                changeToolbar();
            }
        };

        var copyfiles = function () {
            var fileArr = getCheckedFiles();
            if (fileArr.length > 0) {
                _MVCP.action = 'COPY';
                _MVCP.fileobjarr = fileArr;
                _MVCP.fileindex = 0;
            }
            changeToolbar('show-when-mvcp');
            $('.checkbox').prop('checked', false);
            $('.checkbox').addClass('hide');
        };

        var cutfiles = function () {
            var fileArr = getCheckedFiles();
            if (fileArr.length > 0) {
                _MVCP.action = 'MOVE';
                _MVCP.fileobjarr = fileArr;
                _MVCP.fileindex = 0;
            }
            changeToolbar('show-when-mvcp');
            $('.checkbox').prop('checked', false);
            $('.checkbox').addClass('hide');
        };

        var paste = function () {
            if (_MVCP.fileobjarr.length > 0) {
                _MVCP.doaction();
            }
            changeToolbar();
        };

        var rename = function () {
            var fileArr = getCheckedFiles();
            if (fileArr.length !== 1) {
                return;
            }
            var file = fileArr[0];
            var newName = prompt(t('Input new name'), file.name);
            if (!newName || newName === file.name) {
                return;
            }
            file.name = newName;
            _MVCP.action = 'MOVE';
            _MVCP.fileobjarr = [file];
            _MVCP.fileindex = 0;
            _MVCP.doaction(); // 统一走冲突检查: 目标已存在时询问覆盖/跳过
            changeToolbar();
            $('.checkbox').prop('checked', false);
            $('.checkbox').addClass('hide');
        };

        var goUp = function () {
            var pathspl = curPath.replace(root, '').split('/');
            pathspl.pop();
            loadDir(fs.dir(root + pathspl.join('/')));
        };

        var cancel = function (){
            _MVCP.fileobjarr = [];
            changeToolbar();
            $('.checkbox').prop('checked', false);
            $('.checkbox').addClass('hide');
        };

        var getUrls = function(){
            var fileArr = getCheckedFiles();
            var urls = '';
            for(var i in fileArr){
                var file = fileArr[i];
                if(file.type === 'file'){
                    urls += file.url + "\n";
                }
            }
            if(urls) copyToClipboard(urls);
            changeToolbar();
            $('.checkbox').prop('checked', false);
            $('.checkbox').addClass('hide');
        }

        var copyToClipboard = function (text) {
            let textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            try {
                textarea.select();
                document.execCommand('copy');
            } catch (error) {

            }
            document.body.removeChild(textarea);
        }

        function getCheckedFiles() {
            var fileArr = [];
            $('#file-list .checkbox:checked').each(function () {
                var li = $(this).closest('li.file');
                // 被过滤框隐藏的行不参与批量操作
                if(li.length && li.attr('data-name') !== undefined && !li.is(':visible')) return;
                fileArr.push(li[0].fsdata);
            });
            return fileArr;
        }

        // ---- 新增功能 ----
        // 视图切换: 列表 <-> 网格, localStorage 持久化
        var applyView = function () {
            $('#file-list').toggleClass('grid-view', getStorage('viewMode') === 'grid');
        };
        var toggleView = function () {
            setStorage('viewMode', getStorage('viewMode') === 'grid' ? 'list' : 'grid');
            applyView();
        };

        var applyFilter = function () {
            var kw = ($('#file-filter').val() || '').toLowerCase();
            $('#file-list li.file').each(function () {
                var name = $(this).attr('data-name');
                if(name === undefined){ $(this).show(); return; } // 返回上级目录项始终显示
                $(this).toggle(name.toLowerCase().indexOf(kw) !== -1);
            });
        };

        var updateHiddenBtn = function () {
            $('.toggle-dot').toggleClass('text-danger', getStorage('hideDot') === 'true');
        };

        // 语言切换按钮: 显示另一种语言的名称
        var updateLangBtn = function () {
            $('#langBtn').text(getLang() === 'zh-CN' ? 'EN' : '中文');
        };

        var toggleHidden = function () {
            var active = getStorage('hideDot') !== 'true';
            setStorage('hideDot', active ? 'true' : 'false');
            updateHiddenBtn();
            loadDir(fs.dir(curPath));
        };

        var jumpTo = function () {
            var p = prompt(t('Jump prompt'), decodeUriSafe(curPath.replace(root, '')) || '/');
            if(!p) return;
            p = p.trim();
            if(!p) return;
            if(!/^https?:\/\//i.test(p) && p.charAt(0) !== '/') p = '/' + p;
            loadDir(fs.dir(/^https?:\/\//i.test(p) ? p : root + p));
        };

        // 收集拖拽的文件/文件夹(文件夹递归展开, 平铺上传到当前目录)
        function collectFilesFromDrop(dataTransfer, callback) {
            var items = dataTransfer.items;
            var entries = [];
            if(items && items.length && items[0].webkitGetAsEntry){
                for(var i = 0; i < items.length; i++){
                    var en = items[i].webkitGetAsEntry();
                    if(en) entries.push(en);
                }
            }
            if(!entries.length){
                callback(Array.prototype.slice.call(dataTransfer.files || []));
                return;
            }
            var results = [], pending = 0, finished = false;
            var check = function () {
                if(pending === 0 && !finished){
                    finished = true;
                    callback(results);
                }
            };
            var walk = function (entry) {
                pending++;
                if(entry.isFile){
                    entry.file(function (f) { results.push(f); pending--; check(); }, function () { pending--; check(); });
                }else if(entry.isDirectory){
                    var reader = entry.createReader();
                    var readBatch = function () {
                        reader.readEntries(function (subs) {
                            if(subs.length === 0){ pending--; check(); return; }
                            for(var i = 0; i < subs.length; i++) walk(subs[i]);
                            readBatch();
                        }, function () { pending--; check(); });
                    };
                    readBatch();
                }else{
                    pending--; check();
                }
            };
            for(var j = 0; j < entries.length; j++) walk(entries[j]);
            check();
        }
    </script>
</div>

<!-- 上传进度 toast: 上传期间固定右下角显示, 结束后隐藏 -->
<div id="upload-toast" class="hide">
    <div class="upload-toast-head">
        <i class="fa fa-cloud-upload"></i>
        <span id="upload-toast-name"></span>
        <span id="upload-toast-percent" class="upload-toast-percent"></span>
    </div>
    <div class="upload-toast-bar"><div id="upload-toast-progress"></div></div>
    <small id="upload-toast-count" class="upload-toast-count"></small>
</div>
